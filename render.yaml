# Render Blueprint 部署清单（Render 控制台 → New → Blueprint Instance）
# 依赖仓库根目录的 Dockerfile；环境变量见下方 envVars。
services:
  - type: web
    name: triad-workbench
    runtime: docker
    repo: https://github.com/Zalgo1024/SanYuanJieGouBenDiGongZuoTai
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # ── BYOK 公共模式：服务器不持有任何 LLM 密钥，访客必须自带 ──
      - key: PUBLIC_MODE
        value: "1"
      # ── 归属人去个人化：默认工作台名，可改 ──
      - key: DEFAULT_OWNER_NAME
        value: "引力力矩"
      - key: DEFAULT_OWNER_ID
        value: "workbench"
      # ── 联网搜索：不配 Key 也能走 DuckDuckGo 零 Key 降级 ──
      - key: SEARCH_ENABLED
        value: "auto"
